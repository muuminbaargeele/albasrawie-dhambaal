name: albasrawie_dhambaal
description: "Albasrawie Dhambaal messaging app."
publish_to: "none"
version: 0.1.8+9

environment:
  sdk: ^3.8.1

dependencies:
  cached_network_image: ^3.4.1
  dio: ^5.8.0+1
  flutter:
    sdk: flutter
  flutter_chat_bubble: ^2.0.2
  flutter_launcher_icons: ^0.14.4
  flutter_local_notifications: ^19.3.0
  flutter_native_splash: ^2.4.6
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.1.0
  get: ^4.7.2
  get_storage: ^2.1.1
  google_fonts: ^6.2.1
  intl: ^0.20.2
  loading_animation_widget: ^1.3.0
  lucide_icons: ^0.257.0
  permission_handler: ^12.0.0+1
  socket_io_client: ^3.1.2
  timezone: ^0.10.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/waves/
    - assets/icon/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true

  image_path_android: "assets/icon/app_icon.png"
  image_path_ios: "assets/icon/app_icon_ios.png" # iOS icon (must include background)

  adaptive_icon_background: "#F5F5F5" # Optional, only applies to Android
  min_sdk_android: 21
