name: albasrawie_dhambaal
description: "Albasrawie Dhambaal messaging app."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  dio: ^5.8.0+1
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  get: ^4.7.2
  get_storage: ^2.1.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#F5F5F5"
  color_dark: "#222222"
  image: assets/icon/iconLight.png
  image_dark: assets/icon/iconDark.png

  branding: assets/icon/iconBrandLight.png
  branding_dark: assets/icon/iconBrandDark.png

  android_12:
    color: "#F5F5F5"
    color_dark: "#222222"
    image: assets/icon/iconLight12.png
    image_dark: assets/icon/iconDark12.png
    icon_background_color: "#F5F5F5"
    icon_background_color_dark: "#222222"
